<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCI Công việc</title>
<style>
  /* DEMO bản điện thoại — màu lấy đúng token của 3004 (phong.css): thanh trên #1A1A1A · nền kem #FAF9F7 · nhấn cam #EA580C ·
     đỏ #DC2626 chỉ cho cảnh báo · chữ phụ #57534E. Luật 28: chỉ nút mới có viền/nền; nhãn trạng thái là chữ trần. */
  :root { --nen: #FAF9F7; --the: #fff; --muc: #1a1a1a; --phu: #57534E; --vien: #E8E5E0; --cam: #EA580C; --cam-chu: #C2410C; --cam-nhat: #FFF1E6; --do: #DC2626; --vang: #FACC15; --xanh: #15803D; --top: #1A1A1A; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #d9d6d1; font: 15px/1.4 "Segoe UI", Roboto, Arial, sans-serif; color: var(--muc); }
  button { font: inherit; color: inherit; cursor: pointer; }
  #trang { display: flex; gap: 28px; justify-content: center; align-items: flex-start; padding: 24px 12px; flex-wrap: wrap; }

  /* ---- khung điện thoại ---- */
  #may { position: relative; width: 390px; height: 800px; background: var(--nen); border-radius: 28px; overflow: hidden; box-shadow: 0 0 0 10px #111, 0 20px 50px rgba(0,0,0,.35); display: flex; flex-direction: column; }
  @media (max-width: 520px) { #trang { padding: 0; gap: 0; } #may { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; } #dk { display: none; } }

  /* thanh trên */
  .top { flex: none; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; background: var(--top); color: #F5F5F4; }
  .top h1 { flex: 1; margin: 0; font: 700 17px "Times New Roman", serif; letter-spacing: .2px; }
  .chuong { position: relative; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 6px 0 8px; border: 0; background: none; color: #D6D3D1; }
  .so { min-width: 18px; height: 18px; padding: 0 6px; border-radius: 9px; background: var(--do); color: #fff; font-size: 12px; font-weight: 700; line-height: 18px; text-align: center; animation: sang 1.4s ease-in-out infinite; }
  @keyframes sang { 0%, 100% { transform: scale(1); box-shadow: 0 0 4px 1px rgba(220,38,38,.7); } 50% { transform: scale(1.12); box-shadow: 0 0 10px 3px #DC2626; } }

  /* dòng báo họp (3 trạng thái — chốt 28/10/2026): moi = đỏ nháy đứng yên · xem = đỏ chạy ngang · chuanbi = vàng, CHỮ HOA, nháy */
  #hop { flex: none; height: 30px; overflow: hidden; white-space: nowrap; display: none; align-items: center; background: #FFFCFA; border-bottom: 1px solid var(--vien); cursor: pointer; }
  #hop.co { display: flex; }
  #hop .chu { display: inline-block; padding: 0 12px; color: var(--do); font-weight: 600; font-size: 13.5px; }
  #hop.xem .chu { padding-left: 100%; animation: chay 12s linear infinite; }
  #hop.moi { animation: nhay 1s steps(2, start) infinite; }
  #hop.chuanbi { background: var(--vang); animation: nhay 1s steps(2, start) infinite; }
  #hop.chuanbi .chu { color: #991B1B; font-weight: 700; }
  @keyframes chay { to { transform: translateX(-100%); } }
  @keyframes nhay { to { opacity: .3; } }

  /* thân */
  #than { flex: 1; overflow-y: auto; padding-bottom: 12px; }
  .bo-loc { position: sticky; top: 0; z-index: 3; background: var(--nen); padding: 10px 12px 8px; border-bottom: 1px solid var(--vien); }
  .chon { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 12px; border: 1px solid #D5D2CD; border-radius: 10px; background: var(--the); text-align: left; font-weight: 600; }
  .chon small { display: block; color: var(--phu); font-weight: 400; font-size: 12px; }
  .doan { display: flex; gap: 6px; }
  .doan button { flex: 1; padding: 9px 4px; border: 1px solid #D5D2CD; border-radius: 10px; background: var(--the); font-size: 13.5px; font-weight: 600; line-height: 1.2; }
  .doan button.dang { background: var(--cam); border-color: var(--cam); color: #fff; }
  .doan button small { display: block; font-weight: 400; font-size: 11.5px; opacity: .85; }
  .tong { padding: 8px 14px 4px; font-size: 13px; color: var(--phu); }          /* luật 34: hàng tổng nằm trên cùng */
  .tong b { color: var(--muc); } .tong .do { color: var(--do); font-weight: 700; }
  .nhom { padding: 10px 14px 4px; font: 700 13px "Times New Roman", serif; color: var(--cam-chu); letter-spacing: .3px; }

  /* thẻ việc */
  .viec { margin: 0 10px 8px; background: var(--the); border: 1px solid var(--vien); border-radius: 12px; padding: 10px 12px; }
  .viec .ten { font-weight: 600; }
  .viec .gang { color: var(--do); font-weight: 800; margin-right: 4px; }
  .viec .ma { color: var(--phu); font-size: 12.5px; margin-top: 2px; }
  .viec .han { font-size: 13px; margin-top: 3px; color: var(--phu); }
  .viec .han.do { color: var(--do); font-weight: 700; } .viec .han.sap { color: #B45309; font-weight: 600; }
  .chi-tiet { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--vien); font-size: 13.5px; }
  .viec.mo .chi-tiet { display: block; }
  .chi-tiet div { margin: 2px 0; } .chi-tiet span { color: var(--phu); }
  .hanh-dong { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .nut { padding: 9px 14px; border: 1px solid #D5D2CD; border-radius: 9px; background: var(--the); font-weight: 600; font-size: 13.5px; }
  .nut.chinh { background: var(--cam); border-color: var(--cam); color: #fff; }

  /* thanh dưới */
  .duoi { flex: none; display: flex; height: 58px; background: var(--the); border-top: 1px solid var(--vien); }
  .duoi button { flex: 1; border: 0; background: none; font-size: 12px; color: var(--phu); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .duoi button svg { width: 22px; height: 22px; }
  .duoi button.dang { color: var(--cam-chu); font-weight: 700; }
  #nutgiao { position: absolute; right: 16px; bottom: 74px; width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--cam); color: #fff; font-size: 30px; line-height: 1; box-shadow: 0 6px 14px rgba(234,88,12,.45); display: none; }

  /* tầng phủ: thông báo (toàn màn) + khung kéo lên */
  .tang { position: absolute; inset: 0; z-index: 20; display: none; }
  .tang.mo { display: block; }
  #man-tb, #man-cd { background: var(--the); display: none; flex-direction: column; }
  #man-tb.mo, #man-cd.mo { display: flex; }
  .tb-dau { flex: none; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 8px 0 4px; background: var(--top); color: #F5F5F4; }
  .tb-dau b { flex: 1; font: 700 17px "Times New Roman", serif; }
  .lui { border: 0; background: none; color: #F5F5F4; font-size: 24px; width: 44px; height: 44px; }
  .doc-het { border: 0; background: none; color: #FDBA74; font-size: 13.5px; padding: 8px; }
  #ds-tb { flex: 1; overflow-y: auto; }
  .tb { padding: 11px 14px; border-bottom: 1px solid var(--vien); }
  .tb.do { background: #FEF2F2; border-left: 4px solid var(--do); } .tb.do b { color: #B91C1C; }
  .tb b { display: block; } .tb .mn { color: var(--do); font-weight: 800; margin-right: 6px; } .tb small { color: var(--phu); }
  .man { position: absolute; inset: 0; background: rgba(0,0,0,.45); z-index: 30; display: none; align-items: flex-end; }
  .man.mo { display: flex; }
  .khung { width: 100%; max-height: 86%; overflow-y: auto; background: var(--the); border-radius: 18px 18px 0 0; padding: 14px 14px 20px; }
  .khung h2 { margin: 0 0 10px; font: 700 17px "Times New Roman", serif; color: var(--cam-chu); }
  .dong-chon { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 13px 8px; border: 0; border-bottom: 1px solid var(--vien); background: none; text-align: left; }
  .dong-chon.dang { color: var(--cam-chu); font-weight: 700; }
  .dong-chon .n { color: var(--phu); font-size: 13px; text-align: right; } .dong-chon .n .do { color: var(--do); font-weight: 700; }
  label { display: block; margin: 10px 0 4px; font-size: 13px; color: var(--phu); }
  input, textarea, select { width: 100%; padding: 10px 11px; border: 1px solid #D5D2CD; border-radius: 9px; font: inherit; background: #fff; }
  textarea { min-height: 70px; resize: vertical; }
  #toast { position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%); z-index: 40; background: #1A1A1A; color: #fff; padding: 9px 14px; border-radius: 10px; font-size: 13.5px; display: none; max-width: 90%; text-align: center; }

  /* danh sách BIỂU TƯỢNG một cột (Mr. Đại 28/10): giữ lâu → chế độ chỉnh (rung), kéo ≡ để xếp, ⊖ để ẩn */
  .ds-ic { padding: 4px 10px 8px; }
  .ic { position: relative; display: flex; align-items: center; gap: 12px; padding: 11px 12px; margin: 0 0 8px; background: var(--the); border: 1px solid var(--vien); border-radius: 16px; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .ic .bieu { flex: none; width: 46px; height: 46px; border-radius: 14px; background: var(--cam-nhat); color: var(--cam-chu); display: grid; place-items: center; } .ic .bieu svg { width: 26px; height: 26px; }
  .ic .nd { flex: 1; min-width: 0; } .ic .nd b { display: block; line-height: 1.25; } .ic .nd small { color: var(--phu); font-size: 12.5px; } .ic .nd small .do { color: var(--do); font-weight: 700; }
  .ic .mui { color: var(--phu); font-size: 22px; padding: 0 4px; }
  .ic .keo { flex: none; width: 42px; height: 42px; display: grid; place-items: center; font-size: 24px; color: var(--phu); touch-action: none; cursor: grab; }
  .ic .an, .ic .hien { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 0; color: #fff; font-size: 18px; line-height: 1; margin-right: -4px; } .ic .an { background: var(--do); } .ic .hien { background: var(--xanh); }
  .ic.rung { animation: rung .5s ease-in-out infinite alternate; cursor: default; } @keyframes rung { from { transform: rotate(-.5deg); } to { transform: rotate(.5deg); } }
  .ic.keo-dang { z-index: 5; animation: none; box-shadow: 0 10px 22px rgba(0,0,0,.25); }
  .ic.chen-truoc { box-shadow: 0 -4px 0 var(--cam); } .ic.chen-sau { box-shadow: 0 4px 0 var(--cam); }
  .ic.dang-an { opacity: .6; background: #F5F3F0; }
  /* phòng họp: lịch 3 phòng × ô 30 phút. Màu có định nghĩa (luật 18, như web): xanh = trống · vàng = đã đặt · đỏ = đang họp · xám = đã qua */
  .ngay-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .ngay-bar button { width: 44px; height: 40px; border: 1px solid #D5D2CD; border-radius: 10px; background: var(--the); font-size: 20px; }
  .ngay-bar b { flex: 1; text-align: center; }
  .luoi { display: grid; grid-template-columns: 46px repeat(3, 1fr); gap: 3px; padding: 6px 10px 0; }
  .luoi .dau { font-size: 12px; font-weight: 700; text-align: center; padding: 4px 0; color: var(--cam-chu); line-height: 1.2; } .luoi .dau small { display: block; font-weight: 400; color: var(--phu); }
  .luoi .g { font-size: 11.5px; color: var(--phu); text-align: right; padding-right: 4px; line-height: 34px; }
  .luoi .nghi { grid-column: 1 / -1; text-align: center; font-size: 11.5px; color: var(--phu); padding: 3px 0; border-top: 1px dashed var(--vien); border-bottom: 1px dashed var(--vien); }
  .o { height: 34px; border: 0; border-radius: 6px; font-size: 11.5px; line-height: 1.1; padding: 0 3px; overflow: hidden; text-align: left; white-space: nowrap; text-overflow: ellipsis; }
  .o.trong { background: #DCFCE7; color: #166534; } .o.dat { background: #FEF08A; color: #713F12; font-weight: 600; } .o.dang { background: var(--do); color: #fff; font-weight: 600; } .o.qua { background: #E7E5E4; color: #78716C; }
  .chuthich { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 8px 14px; font-size: 12px; color: var(--phu); } .chuthich i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .loi { color: var(--do); font-size: 13px; margin-top: 8px; font-weight: 600; }
  .moi-ds { display: flex; flex-wrap: wrap; gap: 6px; }
  .moi-ds button { padding: 7px 11px; border: 1px solid #D5D2CD; border-radius: 16px; background: #fff; font-size: 13px; } .moi-ds button.dang { background: var(--cam-nhat); border-color: var(--cam); color: var(--cam-chu); font-weight: 700; }
  .hai { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  /* màn giữ thông báo */
  .kiem { display: flex; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--vien); align-items: flex-start; }
  .kiem .d { flex: none; width: 24px; font-size: 18px; line-height: 1.2; } .kiem .ok { color: var(--xanh); } .kiem .sai { color: var(--do); } .kiem .hoi { color: #B45309; }
  .kiem div { flex: 1; font-size: 13.5px; } .kiem b { display: block; font-size: 14.5px; } .kiem small { color: var(--phu); display: block; margin: 2px 0 6px; }
  /* bảng điều khiển demo (không có trong app thật) */
  #dk { width: 330px; background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 6px 20px rgba(0,0,0,.15); font-size: 13.5px; }
  #dk h3 { margin: 0 0 6px; font: 700 16px "Times New Roman", serif; color: var(--cam-chu); }
  #dk button { display: block; width: 100%; margin: 5px 0; padding: 9px; border: 1px solid #D5D2CD; border-radius: 9px; background: #fff; text-align: left; }
  #dk button.dang { background: var(--cam-nhat); border-color: var(--cam); font-weight: 700; }
  #dk p { color: var(--phu); margin: 8px 0 0; }
  #dk .le { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--vien); }

  /* ---- riêng bản app thật: toàn màn hình, không khung điện thoại ---- */
  html, body { background: var(--nen); }
  #trang { display: block; padding: 0; }
  #may { width: 100vw; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; }
  .so.tinh { animation: none; box-shadow: none; }
  .dn { position: absolute; inset: 0; z-index: 50; background: var(--nen); display: none; padding: 28px 24px; overflow-y: auto; }
  .dn.mo { display: block; }
  .dn h1 { margin: 0 0 4px; font: 700 22px "Times New Roman", serif; color: var(--cam-chu); }
  .dn p { margin: 0 0 16px; color: var(--phu); font-size: 13.5px; }
  .dn button[type=submit] { margin-top: 18px; width: 100%; padding: 12px; border: 0; border-radius: 10px; background: var(--cam); color: #fff; font-weight: 700; font-size: 15px; }
  .dn button[type=submit]:disabled { opacity: .6; }
  /* nút «!» đỏ: bấm thì sáng + phát quang, danh sách chỉ còn việc quá hạn */
  .qh-cham { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--do); color: var(--do); font: 800 15px/1 Arial, sans-serif; opacity: .8; transition: all .2s; }
  #b-qh.sang .qh-cham { background: var(--do); color: #fff; opacity: 1; animation: qh-sang 1.4s ease-in-out infinite; }
  @keyframes qh-sang { 0%, 100% { box-shadow: 0 0 4px 1px rgba(220,38,38,.7); } 50% { box-shadow: 0 0 14px 5px #DC2626; } }
  .qh-bao { color: var(--do); font-weight: 600; }
  /* chân chuông: «Xem tin đã đọc» ở góc dưới bên trái */
  .tb-chan { flex: none; display: flex; justify-content: flex-start; padding: 6px 10px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid var(--vien); background: var(--the); }
  .tb-chan button { border: 0; background: none; padding: 8px 4px; color: var(--cam-chu); font-size: 14px; font-weight: 600; text-decoration: underline; }
  /* nút ≡ bảng tiến độ cạnh icon dự án (chỉ dự án có bảng) */
  .td-nut { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 10px; background: var(--cam-nhat); color: var(--cam-chu); padding: 0; }
  /* bảng tiến độ: trái tên việc (dính mép trái), phải sơ đồ theo tháng; cuộn cả hai chiều trong MỘT khung */
  #man-td { background: var(--the); display: none; flex-direction: column; } #man-td.mo { display: flex; }
  .td-c { flex: none; min-width: 34px; height: 30px; padding: 0 6px; border: 1px solid #57534E; border-radius: 8px; background: none; color: #F5F5F4; font-weight: 700; font-size: 13px; }
  #td-ten { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 15px !important; }
  .td-c.sang { background: var(--cam); border-color: var(--cam); color: #fff; }
  #td-than { flex: 1; overflow: auto; position: relative; -webkit-overflow-scrolling: touch; }
  .td-luoi { position: relative; }
  .td-hang { display: flex; height: 30px; border-bottom: 1px solid #F0EDE8; }
  .td-t { position: sticky; left: 0; z-index: 3; flex: none; width: var(--w); box-sizing: border-box; display: flex; align-items: center; padding: 0 6px 0 0; background: var(--the); border-right: 1px solid var(--vien); font-size: 13px; text-align: left; }
  .td-ten { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .td-t.c1 { color: var(--cam-chu); font-weight: 700; } .td-t.c2 { color: var(--cam-chu); } .td-t.c3, .td-t.c4 { color: #1A1A1A; }
  .td-tg { flex: none; width: 22px; height: 30px; display: grid; place-items: center; border: 0; background: none; padding: 0; color: #78716C; } .td-tg.mo svg { transform: rotate(90deg); }
  .td-dau { position: sticky; top: 0; z-index: 5; background: #F5F3EF; } .td-dau .td-t { z-index: 6; background: #F5F3EF; font-weight: 700; color: #44403C; padding-left: 8px; }
  .td-p { position: relative; flex: none; width: var(--tw); }
  .td-th { position: absolute; top: 0; height: 30px; line-height: 30px; box-sizing: border-box; padding-left: 4px; font-size: 11.5px; font-weight: 700; color: #57534E; border-left: 1px solid #D5D2CD; overflow: hidden; white-space: nowrap; }
  .td-gach { position: absolute; top: 30px; bottom: 0; width: 1px; background: #EEEAE4; z-index: 0; pointer-events: none; } /* đường dóng tháng NẰM DƯỚI hình công việc (z-index thấp hơn) → thanh liền mạch, đường găng không bị cắt khúc */
  .td-homnay { position: absolute; top: 30px; bottom: 0; width: 0; border-left: 2px dashed var(--do); opacity: .85; z-index: 1; pointer-events: none; }
  .td-thanh { position: absolute; top: 9px; height: 12px; border-radius: 3px; z-index: 2; } .td-cha { position: absolute; top: 10px; height: 6px; z-index: 2; }
  .td-moc { position: absolute; top: 9px; width: 12px; height: 12px; transform: rotate(45deg); z-index: 2; }
  .td-tam { position: absolute; top: 12px; width: 10px; height: 10px; clip-path: polygon(0 0, 100% 0, 50% 100%); z-index: 2; }
  .td-thanh.cam, .td-cha.cam, .td-tam.cam, .td-moc.cam { background: var(--cam); } .td-thanh.den, .td-cha.den, .td-tam.den, .td-moc.den { background: #1A1A1A; }
  .td-hang.td-sel .td-t { background: var(--cam-nhat); } .td-hang.td-sel { background: var(--cam-nhat); }
  .td-vach { position: absolute; right: -10px; top: 0; bottom: 0; width: 20px; z-index: 7; touch-action: none; cursor: col-resize; } .td-vach::after { content: ""; position: absolute; left: 8px; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: var(--cam); opacity: .35; }
  #td-pop { display: none; position: absolute; left: 8px; z-index: 12; max-width: min(250px, calc(100% - 16px)); padding: 6px 10px; background: #fff; border: 1px solid var(--vien); border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.18); font-size: 12.5px; line-height: 1.4; color: #1a1a1a; } #td-pop b { display: block; font-size: 13px; margin-bottom: 2px; }
  /* ô tìm việc: ô chọn lọc (giao chuyển tiếp) ở trên, ô gõ chữ ở dưới */
  .o-tim { padding: 8px 14px 10px; background: var(--nen); border-bottom: 1px solid #E5E2DD; display: flex; flex-direction: column; gap: 8px; }
  .o-tim select, .o-tim input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #D5D2CD; border-radius: 8px; background: #fff; font: inherit; font-size: 15px; color: inherit; }
  .o-tim select:focus, .o-tim input:focus { outline: none; border-color: var(--cam); }
  .tim-hang { position: relative; }
