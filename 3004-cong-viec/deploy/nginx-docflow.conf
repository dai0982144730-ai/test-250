# /etc/nginx/sites-available/docflow.scigroup.vn  →  ln -s ../sites-available/docflow.scigroup.vn /etc/nginx/sites-enabled/
# Cấp HTTPS: certbot --nginx -d docflow.scigroup.vn   (sau khi DNS đã trỏ về máy chủ)
server {
    listen 80;
    server_name docflow.scigroup.vn;

    client_max_body_size 50m;   # file Word + file kèm

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;   # trợ lý AI trả lời dài
    }
}
